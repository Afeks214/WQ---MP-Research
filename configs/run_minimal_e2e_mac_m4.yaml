module6:
  intake:
    run_policy_class: representative_discovery
    min_availability_ratio: 0.20
    min_observed_sessions: 30
    required_comparison_support: 0.80
  reduction:
    duplicate_corr_threshold: 0.85
  scoring:
    min_cross_universe_support: 0.80
    shortlist_session_keep: 32
    shortlist_minute_keep: 12
    final_scalar_keep: 8
    final_primary_count: 2
    final_alternate_count: 2
  generator:
    random_sparse_quota: 64
    cluster_balanced_quota: 16
    hrp_variant_quota: 12
    mv_variant_quota: 2
    random_sparse_batch_size: 16
    active_cardinality_choices: [1, 2, 3, 4]
