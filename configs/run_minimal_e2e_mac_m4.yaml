harness:
  seed: 97
  research_mode: discovery
  timezone: America/New_York
  freq: 1min
  min_asset_coverage: 0.80
  purge_bars: 30
  embargo_bars: 15
  wf_train_sessions: 30
  wf_test_sessions: 30
  wf_step_sessions: 30
  cpcv_slices: 10
  cpcv_k_test: 5
  disable_cpcv_splits: true
  parallel_backend: process_pool
  parallel_workers: 3
  stress_profile: baseline_mild_severe
  report_dir: ./artifacts
  export_micro_diagnostics: true
  cluster_corr_threshold: 0.85
  group_bound_execution_enabled: true
  group_dispatch_policy: largest_first_stable
  group_max_in_flight_factor: 1
  group_target_wall_time_sec: 180.0
  group_min_candidates_per_chunk: 4
  group_max_candidates_per_chunk_hard: 8
  process_pool_candidate_chunk_size: 4
  scratch_mode: compact
  daily_return_min_days: 30
  benchmark_symbol: SPY
  horizon_minutes: [15, 30, 60]
  robustness_weight_dsr: 0.20
  robustness_weight_pbo: 0.15
  robustness_weight_spa: 0.10
  robustness_weight_regime: 0.20
  robustness_weight_execution: 0.20
  robustness_weight_horizon: 0.15
  robustness_reject_threshold: 0.40
  execution_cost_model: dynamic_bucketed_v1
  execution_transaction_cost_per_trade: 0.0015
  execution_finra_taf_per_share_sell: 0.000195
  execution_sec31_rate_per_million: 0.0
  execution_short_borrow_apr: 0.003
  execution_short_locate_fee_per_share: 0.0
  execution_debit_apr: 0.0
  execution_max_volume_participation: 0.10
  execution_open_bucket_minutes: 30
  execution_close_bucket_minutes: 30
  execution_open_slippage_mult: 1.25
  execution_mid_slippage_mult: 1.00
  execution_close_slippage_mult: 1.15
  execution_participation_slippage_coeff: 1.0
  execution_dynamic_slippage_bps_cap: 15.0

stress_scenarios:
